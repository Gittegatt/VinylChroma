[platformio]
default_envs = esp32-s3-supermini

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
extra_scripts = post:scripts/export_flash_manifest.py
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit TCS34725@^1.4.4
  adafruit/Adafruit BusIO@^1.17.2

; Generic 4 MB ESP32-S3 profiles use the larger dual-OTA layout. VinylChroma
; does not currently require the 2 MB PSRAM fitted to the standard boards.
[env:esp32-s3-supermini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DVINYLCHROMA_BOARD_ESP32_S3_SUPERMINI

[env:esp32-s3-zero]
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DVINYLCHROMA_BOARD_ESP32_S3_ZERO

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DVINYLCHROMA_BOARD_ESP32_C3_SUPERMINI

[env:esp32-c3-zero]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DVINYLCHROMA_BOARD_ESP32_C3_ZERO

[env:seeed-xiao-esp32-s3]
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DVINYLCHROMA_BOARD_SEEED_XIAO_ESP32_S3

[env:adafruit-qtpy-esp32-s3-n4r2]
board = adafruit_qtpy_esp32s3_n4r2
build_flags =
  ${env.build_flags}
  -DVINYLCHROMA_BOARD_ADAFRUIT_QTPY_ESP32_S3_N4R2

[env:adafruit-qtpy-esp32-s3-nopsram]
board = adafruit_qtpy_esp32s3_nopsram
build_flags =
  ${env.build_flags}
  -DVINYLCHROMA_BOARD_ADAFRUIT_QTPY_ESP32_S3_NOPSRAM

[env:esp32-s3-tiny]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DVINYLCHROMA_BOARD_ESP32_S3_TINY

; OTA companions use the default mDNS hostname. Override it at upload time with
; --upload-port when mDNS is unavailable or the hostname was changed.
[env:esp32-s3-supermini-ota]
extends = env:esp32-s3-supermini
upload_protocol = espota
upload_port = vinylchroma.local

[env:esp32-s3-zero-ota]
extends = env:esp32-s3-zero
upload_protocol = espota
upload_port = vinylchroma.local

[env:esp32-c3-supermini-ota]
extends = env:esp32-c3-supermini
upload_protocol = espota
upload_port = vinylchroma.local

[env:esp32-c3-zero-ota]
extends = env:esp32-c3-zero
upload_protocol = espota
upload_port = vinylchroma.local

[env:seeed-xiao-esp32-s3-ota]
extends = env:seeed-xiao-esp32-s3
upload_protocol = espota
upload_port = vinylchroma.local

[env:adafruit-qtpy-esp32-s3-n4r2-ota]
extends = env:adafruit-qtpy-esp32-s3-n4r2
upload_protocol = espota
upload_port = vinylchroma.local

[env:adafruit-qtpy-esp32-s3-nopsram-ota]
extends = env:adafruit-qtpy-esp32-s3-nopsram
upload_protocol = espota
upload_port = vinylchroma.local

[env:esp32-s3-tiny-ota]
extends = env:esp32-s3-tiny
upload_protocol = espota
upload_port = vinylchroma.local
